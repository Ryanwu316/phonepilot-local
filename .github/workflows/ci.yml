name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install development dependencies
        run: |
          python -m pip install uv==0.11.18
          uv sync --locked --extra dev --python python
          npm ci
      - name: Python tests
        run: uv run --locked --extra dev pytest -q
      - name: Frontend tests and formatting
        run: |
          npm test
          npm run format:check
      - name: Build and check source archive
        run: |
          uv build
          uv run --locked --extra dev python tools/package_release.py --output dist/phonepilot-local-source.zip
